name: persianphish-integrated

services:
  review:
    # The tag the reviewer's release actually publishes. It used to carry an
    # "-integrated" suffix that no release ever produced, so loading the
    # published artefact left Compose looking for an image that did not exist.
    image: agentic-phishing-review:${REVIEW_VERSION:-1.10.0}
    platform: linux/amd64
    # These images are distributed as saved artefacts, never pushed to a
    # registry, so a missing tag should say so rather than attempt a pull.
    pull_policy: never
    # Read the OpenRouter settings straight from .env into the container.
    #
    # They are deliberately NOT repeated under environment: below. Compose
    # interpolates ${OPENROUTER_*} from the invoking shell first and only then
    # from --env-file, so a developer machine that exports OPENROUTER_API_KEY /
    # OPENROUTER_BASE_URL for some other tool (a very common setup) silently
    # overrode the correct values in .env. The reviewer then pointed at the
    # wrong endpoint, every LLM call returned 403, and the agent abstained on
    # everything while all containers still reported healthy. env_file loads the
    # file directly into the container and is immune to that shell shadowing.
    env_file:
      - .env
    environment:
      REVIEW_API_KEY: ${INTERNAL_REVIEW_API_KEY:?Set INTERNAL_REVIEW_API_KEY in .env}
      REVIEW_DATABASE_PATH: /data/reviews.sqlite3
      REVIEW_USE_BROWSER: "0"
      REVIEW_WORKER_CONCURRENCY: ${REVIEW_WORKER_CONCURRENCY:-2}
      REVIEW_RETENTION_DAYS: ${REVIEW_RETENTION_DAYS:-30}
      # Reference retrieval. Empty by default, which is a supported
      # configuration: the reviewer then supplies no comparison references.
      #
      # These were present in the build-from-source compose and missing here,
      # which is the file every released deployment actually uses. The effect
      # was that --full started a healthy retrieval service, wrote RAG_BASE_URL
      # into .env, and the reviewer container still never received it: all three
      # containers healthy, retrieval answering queries, and
      # reference_service_configured false.
      RAG_BASE_URL: ${RAG_BASE_URL:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_TIMEOUT_S: ${RAG_TIMEOUT_S:-15}
      RAG_TOP_K: ${RAG_TOP_K:-3}
    ports:
      - "127.0.0.1:${REVIEW_HOST_PORT:-8090}:8090"
    volumes:
      - review-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2.0
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  detector:
    image: phishing-detection-engine:${DETECTOR_VERSION:-3.7.1}
    platform: linux/amd64
    pull_policy: never
    depends_on:
      review:
        condition: service_healthy
    environment:
      PPD_MODEL_PATH: /app/artifacts/v3/detector_v3_tcn.joblib
      PPD_INTEL_DB: /app/var/intel.sqlite3
      PPD_REVIEW_DB: /app/var/review.sqlite3
      PPD_RESULT_DIR: /app/var/results
      PPD_USE_BROWSER: "1"
      PPD_ALLOW_PRIVATE_NETWORK: "0"
      PPD_AGENT_BASE_URL: http://review:8090
      PPD_AGENT_API_KEY: ${INTERNAL_REVIEW_API_KEY:?Set INTERNAL_REVIEW_API_KEY in .env}
      PPD_AGENT_TIMEOUT_S: ${PPD_AGENT_TIMEOUT_S:-75}
      PPD_AGENT_POLL_INTERVAL_S: ${PPD_AGENT_POLL_INTERVAL_S:-0.25}
      PPD_API_KEY: ${PPD_API_KEY:-}
    ports:
      - "127.0.0.1:${PPD_HOST_PORT:-8088}:8088"
    volumes:
      - detector-data:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: "1gb"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 512
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  detector-data:
  review-data:
