services:
  mock-openrouter:
    image: agentic-phishing-review:1.3.0-integration-test
    build:
      context: ${AGENT_REVIEW_CONTEXT:-../../agentic-phishing-review}
      dockerfile: Dockerfile
      target: integration-test
      args:
        INSTALL_BROWSER: "0"
        APP_VERSION: "1.3.0"
    command: ["python", "/app/scripts/mock_openrouter.py"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  review:
    depends_on:
      mock-openrouter:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: integration-test-key
      OPENROUTER_BASE_URL: http://mock-openrouter:8000/api/v1
