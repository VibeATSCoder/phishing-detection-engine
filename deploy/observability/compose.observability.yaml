# Observability stack for PersianPhish: Prometheus, Grafana, Tempo, and an
# OpenTelemetry collector.
#
# This file only brings up the observability plane. Start it alongside the
# service compose files on a shared external network:
#
#   docker network create persianphish
#   docker compose -f compose.yaml up -d                        # per service
#   docker compose -f deploy/observability/compose.observability.yaml up -d
#
# Every port binds to 127.0.0.1. None of these components authenticate by
# default, and the dashboards describe your detection posture, so do not expose
# them without putting a reverse proxy and auth in front.

name: persianphish-observability

networks:
  persianphish:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [persianphish]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Metrics here carry no case-level data, so a long retention is cheap and
      # makes drift comparisons across releases possible.
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    networks: [persianphish]
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    restart: unless-stopped
    networks: [persianphish]
    depends_on: [tempo]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    networks: [persianphish]
    volumes:
      - tempo-data:/var/tempo
    command: ["-target=all", "-storage.trace.backend=local",
              "-storage.trace.local.path=/var/tempo/traces",
              "-storage.trace.wal.path=/var/tempo/wal",
              "-auth.enabled=false"]
