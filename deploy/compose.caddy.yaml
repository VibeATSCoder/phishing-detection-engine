# TLS overlay: puts Caddy in front of the detector so a browser extension (which
# cannot fetch a plain-http public backend — Chrome blocks it as mixed content)
# can reach it over HTTPS.
#
#   CADDY_DOMAIN=detector.example.com \
#   docker compose -f deploy/compose.images.yaml -f deploy/compose.references.yaml \
#                  -f deploy/compose.caddy.yaml up -d
#
# With this overlay, set the detector to loopback in .env (BIND_HOST=127.0.0.1)
# so it does not fight Caddy for port 80; Caddy reaches it over the compose
# network as detector:8088. Point the extension at https://${CADDY_DOMAIN}.
name: persianphish-integrated

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN to the detector domain (A record -> this host)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      detector:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy-data:
  caddy-config:
