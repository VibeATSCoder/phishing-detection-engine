[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persianphish-realworld-detector"
version = "3.6.0"
description = "Calibrated phishing detection with crawl-quality gating and bounded agentic review"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "idna>=3.7,<4",
    "joblib>=1.3,<2",
    "lxml>=5.2,<7",
    "numpy>=1.24,<2",
    "onnxruntime>=1.18,<2",
    "pandas>=2.0,<3",
    "pydantic>=2.6,<3",
    "scikit-learn>=1.3,<1.4",
    "tldextract>=5.1,<6",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
tcn = [
    "torch>=2.3,<2.4",
    "onnx>=1.16,<1.17",
    "onnxruntime>=1.18,<1.19",
    "ml-dtypes>=0.3,<0.4",
]
test = ["pytest>=8.1,<9", "pytest-asyncio>=0.23,<1"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.7,<4", "seaborn>=0.13,<1"]
observability = [
    "prometheus-client>=0.20,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[project.scripts]
persianphish-detect = "persianphish_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
